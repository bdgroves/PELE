name: PELE Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/probe.py
      - run: |
          git config user.name "PELE Bot"
          git config user.email "pele-bot@users.noreply.github.com"
          git add tools/probe_out.json
          git commit -m "Probe results" || exit 0
          git pull --rebase && git push
